name: Build

# Dormant until a version tag exists. No tag = no release, no run.
# When vX.Y.Z has real user-visible changes: git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging deps (fpm for deb/rpm/pacman)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm ruby ruby-dev libarchive-tools zstd
          sudo gem install fpm

      - run: npm ci

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run build:linux
        env:
          USE_SYSTEM_FPM: 'true'

      # .xbps (Void Linux): repack the .deb via xbps-create in a void container.
      # Version read from package.json so it never rots on hardcoded numbers.
      - name: Build .xbps (Void Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEB_FILE=$(ls dist/*.deb | head -1)
          docker run --rm -e VERSION=$VERSION -v $PWD:/host voidlinux/voidlinux /bin/sh -c "
            echo 'repository=https://repo-default.voidlinux.org/current' > /etc/xbps.d/00-repository-main.conf
            xbps-install -Sy xbps binutils xz zstd
            mkdir -p /tmp/zar-build
            cd /tmp && ar x /host/$DEB_FILE
            if [ -f data.tar.zst ]; then
              tar -xf data.tar.zst -C /tmp/zar-build/
            elif [ -f data.tar.xz ]; then
              tar -xf data.tar.xz -C /tmp/zar-build/
            elif [ -f data.tar.gz ]; then
              tar -xf data.tar.gz -C /tmp/zar-build/
            else
              echo 'No data.tar.* found in .deb'
              exit 1
            fi
            xbps-create \
              -A x86_64 \
              -n \"zar-browser-${VERSION}_1\" \
              -s 'Minimalist Chromium-based browser' \
              -D 'gtk+3 libnotify nss libXScrnSaver libXtst xdg-utils at-spi2-core util-linux libsecret' \
              -H 'https://github.com/neo-zero23/Zar-Browser' \
              -l 'MPL-2.0' \
              -m 'neo-zero23 <neo-zero23@users.noreply.github.com>' \
              -o /host/dist/zar-browser-${VERSION}_1.x86_64.xbps \
              /tmp/zar-build
          "

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:win

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.xbps
            dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
