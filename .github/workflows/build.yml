name: Build

# Dormant until a version tag exists. No tag = no release, no run.
# When vX.Y.Z has real user-visible changes: git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging deps (fpm for deb/rpm/pacman)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm ruby ruby-dev
          sudo gem install fpm

      - run: npm ci

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run build:linux
        env:
          USE_SYSTEM_FPM: 'true'

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:win

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
