<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; media-src 'self' https:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Zar</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app-container">
    <!-- Window Titlebar with Tabs -->
    <header id="titlebar">
      <div class="drag-region">
        <div class="zar-logo" title="Zar Browser">
          <span class="zar-logo-text">Z<span class="zar-red">A</span>R</span>
        </div>
        <div id="tabs-list">
          <!-- Dynamic tabs injected by renderer.js -->
        </div>
        <button id="add-tab-btn" class="titlebar-btn" title="New tab (Ctrl+T)">+</button>
      </div>
      <div class="window-controls">
        <button id="win-minimize" class="win-btn" title="Minimize">—</button>
        <button id="win-maximize" class="win-btn" title="Maximize">🗖</button>
        <button id="win-close" class="win-btn win-btn-close" title="Close">✕</button>
      </div>
    </header>

    <!-- Navigation Toolbar -->
    <div id="toolbar">
      <button id="nav-back" class="nav-btn" title="Back (Alt+Left)">
        <svg width="16" height="16" viewBox="0 0 1024 1024" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="m222.927 580.115 301.354 328.512c24.354 28.708 20.825 71.724-7.883 96.078s-71.724 20.825-96.078-7.883L19.576 559.963a67.9 67.9 0 0 1-13.784-20.022 68 68 0 0 1-5.977-29.488l.001-.063a68.34 68.34 0 0 1 7.265-29.134 68 68 0 0 1 1.384-2.6 67.6 67.6 0 0 1 10.102-13.687L429.966 21.113c25.592-27.611 68.721-29.247 96.331-3.656s29.247 68.721 3.656 96.331L224.088 443.784h730.46c37.647 0 68.166 30.519 68.166 68.166s-30.519 68.166-68.166 68.166z"/></svg>
      </button>
      <button id="nav-forward" class="nav-btn" title="Forward (Alt+Right)">
        <svg width="16" height="16" viewBox="0 0 1024 1024" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M799.584 440.059 498.23 111.547c-24.354-28.708-20.825-71.724 7.883-96.078s71.724-20.825 96.078 7.883l400.744 436.859a67.9 67.9 0 0 1 13.784 20.022 68 68 0 0 1 5.977 29.488l-.001.063a68.34 68.34 0 0 1-7.265 29.134 68 68 0 0 1-1.384 2.6 67.6 67.6 0 0 1-10.102 13.687L592.545 999.061c-25.592 27.611-68.721 29.247-96.331 3.656s-29.247-68.721-3.656-96.331L798.423 576.39H67.963c-37.647 0-68.166-30.519-68.166-68.166s30.519-68.166 68.166-68.166h731.621z"/></svg>
      </button>
      <button id="nav-reload" class="nav-btn" title="Reload (Ctrl+R / F5)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M13.7071 1.29289C14.0976 1.68342 14.0976 2.31658 13.7071 2.70711L12.4053 4.00896C17.1877 4.22089 21 8.16524 21 13C21 17.9706 16.9706 22 12 22C7.02944 22 3 17.9706 3 13C3 12.4477 3.44772 12 4 12C4.55228 12 5 12.4477 5 13C5 16.866 8.13401 20 12 20C15.866 20 19 16.866 19 13C19 9.2774 16.0942 6.23349 12.427 6.01281L13.7071 7.29289C14.0976 7.68342 14.0976 8.31658 13.7071 8.70711C13.3166 9.09763 12.6834 9.09763 12.2929 8.70711L9.29289 5.70711C9.10536 5.51957 9 5.26522 9 5C9 4.73478 9.10536 4.48043 9.29289 4.29289L12.2929 1.29289C12.6834 0.902369 13.3166 0.902369 13.7071 1.29289Z"/></svg>
      </button>
      <button id="nav-home" class="nav-btn" title="Home">
        <svg width="16" height="16" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-miterlimit="10" xmlns="http://www.w3.org/2000/svg"><path d="M3 17 16 4l13 13"/><path d="M6 14v13h7V17h6v10h7V14"/></svg>
      </button>

      <button id="engine-btn" class="nav-btn engine-btn" title="Search engine">D</button>
      <div id="engine-dropdown" class="quick-settings-dropdown hidden">
        <div class="qs-item" data-engine="duckduckgo"><span class="qs-icon">D</span><span class="qs-label">DuckDuckGo</span></div>
        <div class="qs-item" data-engine="google"><span class="qs-icon">G</span><span class="qs-label">Google</span></div>
        <div class="qs-item" data-engine="brave"><span class="qs-icon">B</span><span class="qs-label">Brave</span></div>
        <div class="qs-item" data-engine="startpage"><span class="qs-icon">S</span><span class="qs-label">Startpage</span></div>
        <div class="qs-item" data-engine="searxng"><span class="qs-icon">X</span><span class="qs-label">SearXNG</span></div>
      </div>

      <div id="search-container" class="url-bar-container">
        <input id="url-input" type="text" placeholder="Search or enter a web address..." autocomplete="off" spellcheck="false">
        <div id="loading-progress" class="progress-bar-hidden"></div>
      </div>

      <button id="clean-cache-btn" class="nav-btn clean-btn" title="Free RAM">🧹</button>
      <button id="dl-btn" class="nav-btn" title="Active downloads">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 3h2v9.586l2.293-2.293 1.414 1.414L12 16.414l-4.707-4.707 1.414-1.414L11 12.586V3zM5 19h14v2H5z"/>
        </svg>
        <svg id="dl-ring" class="dl-ring hidden" viewBox="0 0 28 28" width="28" height="28">
          <circle id="dl-ring-circle" cx="14" cy="14" r="12" fill="none" stroke="var(--accent-red)" stroke-width="2" stroke-dasharray="75.4" stroke-dashoffset="75.4" transform="rotate(-90 14 14)"/>
        </svg>
      </button>
      <button id="quick-settings-btn" class="nav-btn" title="Menu">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <circle cx="12" cy="5" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="12" cy="19" r="2" />
        </svg>
      </button>
    </div>

    <!-- Main Workspace Container -->
    <main id="content-container">
      <!-- Embedded Homepage Overlay -->
      <div id="homepage-overlay" class="homepage-overlay">
        <div class="homepage-center">
          <div class="homepage-logo">
            <span class="logo-text wordmark">Z<span class="logo-accent">A</span>R</span>
            <img class="logo-icon" src="../assets/iconmini.svg" alt="Zar">
          </div>
          <div class="homepage-search-box">
            <input id="homepage-search-input" type="text" placeholder="Search the web or type a URL..." autocomplete="off" spellcheck="false" autofocus>
          </div>
          <div class="homepage-shortcuts">
            <a href="#" class="shortcut-item" data-url="https://duckduckgo.com">DuckDuckGo</a>
            <a href="#" class="shortcut-item" data-url="https://youtube.com">YouTube</a>
            <a href="#" class="shortcut-item" data-url="https://github.com">GitHub</a>
            <a href="#" class="shortcut-item" data-url="https://reddit.com">Reddit</a>
            <a href="#" class="shortcut-item" data-url="https://twitch.tv">Twitch</a>
          </div>
        </div>
      </div>
      <!-- WebContentsView is mounted dynamically below #toolbar when a tab has a URL -->
    </main>
  </div>

  <!-- Minimal Menu Dropdown -->
  <div id="quick-settings-dropdown" class="quick-settings-dropdown hidden">
    <div class="qs-item" data-action="new-tab">
      <span class="qs-icon">➕</span>
      <span class="qs-label">New tab</span>
    </div>
    <div class="qs-item" data-action="clear-cache">
      <span class="qs-icon">🧹</span>
      <span class="qs-label">Free RAM</span>
    </div>
    <div class="qs-item" data-action="devtools">
      <span class="qs-icon">🛠️</span>
      <span class="qs-label">Developer tools</span>
    </div>
    <div class="qs-item" data-action="settings">
      <span class="qs-icon">⚙️</span>
      <span class="qs-label">Settings</span>
    </div>
    <div class="qs-divider"></div>
    <div class="qs-item" data-action="about">
      <span class="qs-icon">⚡</span>
      <span class="qs-label">About Zar</span>
    </div>
  </div>

  <!-- Downloads UI lives in the anchored bubble (see ui/download-popup.html).
       Plain HTML dropdowns render behind the WebContentsView. -->
  <script src="renderer.js"></script>
</body>

</html>
